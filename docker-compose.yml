services:
  # this service is used by configserver
  rabbit:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - tbalnetwork

  configserver: # service name
    image: "mastertbal/configserver:s6"
    container_name: configserver-ms # else a random name will be given to it
    restart: unless-stopped
    ports:
      - "8071:8071"
    deploy:
      resources:
        limits:
          memory: 700m # don't use beyond 700mb
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8071 && printf 'GET /actuator/health/readiness HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      rabbit:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: "rabbit" # same with the service name above
    networks:
      - tbalnetwork

  accounts: # service name
    image: "mastertbal/accounts:s6"
    container_name: accounts-ms # else a random name will be given to it
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 700m # don't use beyond 700mb
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: "rabbit" # same with the service name above
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILES_ACTIVE: default
    networks:
      - tbalnetwork

  loans: # service name
    image: "mastertbal/loans:s6"
    container_name: loans-ms # else a random name will be given to it
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 700m # don't use beyond 700mb
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: "rabbit" # same with the service name above
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILES_ACTIVE: default
    networks:
      - tbalnetwork

  cards: # service name
    image: "mastertbal/cards:s6"
    container_name: cards-ms # else a random name will be given to it
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 700m # don't use beyond 700mb
    depends_on:
      configserver:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: "rabbit" # same with the service name above
      SPRING_CONFIG_IMPORT: configserver:http://configserver:8071/
      SPRING_PROFILES_ACTIVE: default
    networks:
      - tbalnetwork

networks: # specify the network they will all be in
  tbalnetwork: # name of the network
    driver: "bridge" # name of the
